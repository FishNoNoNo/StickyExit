name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q auth converter parser web config.py main.py storage.py

      - name: Import smoke test
        run: |
          python - <<'PY'
          import auth.allocator
          import auth.users
          import config
          import converter
          import parser.fetcher
          import storage
          from web.server import create_app

          app = create_app()
          assert len(app.routes) > 0
          print(f"imports ok, {len(app.routes)} routes")
          PY

      - name: Check entrypoint syntax
        run: bash -n docker-entrypoint.sh

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Build (vue-tsc + vite)
        working-directory: web/frontend
        run: npm run build

      - name: Committed web/static must match the build
        run: |
          if ! git diff --quiet -- web/static; then
            echo "::error::web/static 与前端源码不一致，请在 web/frontend 执行 npm run build 并提交产物"
            git diff --stat -- web/static
            exit 1
          fi

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sticky-exit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
